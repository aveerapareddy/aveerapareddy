<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Continuous batching benchmark: 1335 requests per second batched versus 510 unbatched" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="280" fill="#121216"></rect>
  <g font-family="'DejaVu Sans Mono', monospace">
